# state.archymedes.xyz: the Chokepoint web app + a cached news-feed proxy (/api/feeds).
#   bun run deploy
name = "chokepoint"
main = "worker/app.ts"
compatibility_date = "2026-10-01"
workers_dev = false

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[routes]]
pattern = "state.archymedes.xyz"
custom_domain = true
